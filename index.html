<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tintin Today - Coming Soon</title>
    <style>
        /* Reset margins and set up full-screen centering */
        body {
            margin: 0;
            padding: 20px;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
            color: #333;
            box-sizing: border-box;
        }

        /* Container to keep content neat */
        .container {
            text-align: center;
            max-width: 500px;
        }

        /* Responsive image styling */
        .logo {
            max-width: 100%;
            height: auto;
            margin-bottom: 24px;
            border-radius: 8px; /* Optional: rounds image corners */
        }

        /* Clean typography */
        h1 {
            font-size: 2.5rem;
            margin: 0 0 10px 0;
            letter-spacing: 1px;
        }

        p {
            font-size: 1.1rem;
            color: #666;
            margin: 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Replace the src URL with your own image path -->
        <img class="logo" src="tintin.png" alt="Logo or Placeholder Image">
        <h1>Coming Soon</h1>
        <p>We are working hard to bring you something amazing.</p>
    </div>

</body>
</html>
